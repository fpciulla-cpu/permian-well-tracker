name: 01 - Source probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          pip install -r probe/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run probe
        run: python probe/probe_sources.py

      - name: Save report to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/output || true
          git commit -m "Probe report $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Nothing to commit"
          git push
